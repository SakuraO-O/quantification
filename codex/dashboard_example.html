<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>趋势观察台</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #fff;
      --surface-soft: #f8fafb;
      --ink: #18212b;
      --muted: #687684;
      --line: #dde3e8;
      --line-strong: #c8d1d9;
      --green: #087a55;
      --green-bg: #e8f6ef;
      --red: #b42332;
      --red-bg: #fbeaec;
      --amber: #9a5b00;
      --amber-bg: #fff2d9;
      --blue: #1769aa;
      --blue-bg: #e9f3fb;
      --gray-bg: #edf1f4;
      --shadow: 0 8px 22px rgba(27, 39, 51, 0.06);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    body.auth-locked { overflow: hidden; }
    body.auth-locked .app-header, body.auth-locked main, body.auth-locked dialog:not(#auth-gate) {
      visibility: hidden;
      pointer-events: none;
    }
    .auth-gate {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: linear-gradient(rgba(23, 35, 45, 0.94), rgba(23, 35, 45, 0.94)), #17232d;
    }
    body.auth-locked .auth-gate { display: flex; }
    .auth-card {
      width: min(420px, 100%);
      background: var(--surface);
      border-radius: 7px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      padding: 24px;
    }
    .auth-title { margin: 0; font-size: 22px; line-height: 1.2; }
    .auth-copy { margin: 9px 0 20px; color: var(--muted); line-height: 1.6; }
    .form-label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; }
    .form-input {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      padding: 9px 10px;
      color: var(--ink);
    }
    .auth-error { min-height: 18px; color: var(--red); font-size: 12px; margin: 8px 0; }
    .primary-btn {
      width: 100%;
      border: 1px solid #263946;
      background: #263946;
      color: #fff;
      padding: 10px 12px;
      border-radius: 5px;
      font-weight: 650;
    }
    .app-header { background: #17232d; color: #fff; padding: 18px 28px 16px; }
    .header-inner, main { max-width: 1460px; margin: 0 auto; }
    .header-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    h1 { margin: 0; font-size: 23px; font-weight: 700; }
    .subtitle { margin: 6px 0 0; color: #b6c5d0; font-size: 13px; }
    .as-of { color: #d7e1e8; font-variant-numeric: tabular-nums; white-space: nowrap; }
    main { padding: 20px 22px 34px; }
    section { margin-bottom: 22px; }
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 10px;
    }
    .section-title h2 { margin: 0; font-size: 16px; }
    .section-note { color: var(--muted); font-size: 12px; }
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .kpi {
      display: block;
      width: 100%;
      min-height: 96px;
      padding: 15px 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: var(--shadow);
      color: inherit;
      text-align: left;
    }
    .kpi-label { color: var(--muted); font-size: 13px; }
    .kpi-value { margin-top: 7px; font-size: 30px; line-height: 1; font-weight: 750; font-variant-numeric: tabular-nums; }
    .kpi-foot { margin-top: 9px; color: var(--muted); font-size: 12px; }
    .kpi.good .kpi-value { color: var(--green); }
    .kpi.warn .kpi-value { color: var(--amber); }
    .kpi.risk .kpi-value { color: var(--red); }
    .kpi.neutral .kpi-value { color: var(--blue); }
    .focus-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }
    .focus-card {
      padding: 14px 15px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 4px solid var(--amber);
      border-radius: 6px;
      text-align: left;
      box-shadow: var(--shadow);
    }
    .focus-card.risk { border-left-color: var(--red); }
    .focus-card.good { border-left-color: var(--green); }
    .focus-card.watch { border-left-color: var(--blue); }
    .focus-card.focus-compact {
      position: relative;
      overflow: hidden;
      min-height: 126px;
      padding: 13px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--amber);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow);
    }
    .focus-card.index-focus.value-deep { border-left-color: #045c3b; }
    .focus-card.index-focus.value-low { border-left-color: #14804a; }
    .focus-card.index-focus.value-neutral { border-left-color: #8b97a3; }
    .focus-card.index-focus.value-high { border-left-color: var(--amber); }
    .focus-card.index-focus.value-risk { border-left-color: var(--red); }
    .focus-card.stock-focus.dividend-good { border-left-color: var(--green); }
    .focus-card.stock-focus.dividend-risk { border-left-color: var(--red); }
    .focus-card.stock-focus.dividend-neutral { border-left-color: var(--amber); }
    .focus-compact .focus-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .focus-compact .focus-index-name { font-size: 16px; font-weight: 750; line-height: 1.2; }
    .focus-compact .focus-index-code { margin-top: 4px; color: var(--muted); font-size: 12px; font-weight: 400; letter-spacing: 0; }
    .focus-compact .focus-quote { text-align: right; min-width: 92px; }
    .focus-compact .focus-label { color: var(--muted); font-size: 12px; font-weight: 400; }
    .focus-compact .focus-close { font-size: 17px; line-height: 1; font-weight: 760; font-variant-numeric: tabular-nums; letter-spacing: 0; }
    .focus-compact .focus-change { margin-top: 5px; font-size: 12px; line-height: 1.35; font-weight: 750; font-variant-numeric: tabular-nums; }
    .focus-compact .focus-change.up { color: var(--red); }
    .focus-compact .focus-change.down { color: var(--green); }
    .focus-compact .focus-change.flat { color: var(--muted); }
    .focus-compact .focus-metric { margin-top: 13px; }
    .focus-compact .focus-metric-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .focus-compact .focus-metric-value { color: var(--ink); font-size: 15px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .focus-compact .focus-metric-value.value-deep { color: #045c3b; }
    .focus-compact .focus-metric-value.value-low { color: #14804a; }
    .focus-compact .focus-metric-value.value-neutral { color: #52616e; }
    .focus-compact .focus-metric-value.value-high { color: var(--amber); }
    .focus-compact .focus-metric-value.value-risk { color: var(--red); }
    .focus-compact .focus-metric-value.dividend-good { color: var(--green); }
    .focus-compact .focus-metric-value.dividend-risk { color: var(--red); }
    .focus-compact .focus-metric-value.dividend-neutral { color: var(--ink); }
    .focus-compact .focus-status-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--line); }
    .focus-compact .focus-status-value { margin-top: 5px; font-size: 13px; font-weight: 750; }
    .focus-compact .focus-status-value.good { color: var(--green); }
    .focus-compact .focus-status-value.watch { color: var(--blue); }
    .focus-compact .focus-status-value.risk { color: var(--red); }
    .focus-compact .focus-status-value.warn { color: var(--amber); }
    .asset-name { font-weight: 700; font-size: 15px; }
    .asset-symbol { display: block; color: var(--muted); margin-top: 3px; font-size: 12px; }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-soft);
    }
    .segments { display: flex; flex-wrap: wrap; gap: 5px; }
    .segment {
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: #4c5a67;
      padding: 7px 10px;
      border-radius: 5px;
      font-size: 12px;
    }
    .segment.active { background: #263946; border-color: #263946; color: #fff; }
    .search {
      width: min(270px, 100%);
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: #fff;
      padding: 8px 10px;
      color: var(--ink);
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; min-width: 1446px; }
    [data-table-type="股票"] table { min-width: 1296px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f8fafb;
      color: #60707e;
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }
    .sort-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      font-size: inherit;
      font-weight: inherit;
    }
    .sort-btn.sorted { color: var(--ink); }
    .sort-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 12px;
      color: #93a0aa;
      font-size: 11px;
      line-height: 1;
    }
    .sort-btn.sorted .sort-icon { color: var(--blue); }
    td { font-size: 13px; }
    tbody tr { cursor: pointer; transition: background 120ms ease; }
    tbody tr:hover { background: #f0f6fa; }
    th:first-child, td:first-child {
      position: sticky;
      left: 0;
      z-index: 1;
      width: 136px;
      min-width: 128px;
      background: #fff;
      box-shadow: 7px 0 9px -9px rgba(32, 47, 59, 0.72);
    }
    th:first-child { z-index: 3; background: #f8fafb; }
    tbody tr:hover td:first-child { background: #f0f6fa; }
    th:nth-child(2), td:nth-child(2) { width: 120px; min-width: 120px; white-space: nowrap; }
    [data-table-type="指数"] th:nth-child(3), [data-table-type="指数"] td:nth-child(3),
    [data-table-type="股票"] th:nth-child(3), [data-table-type="股票"] td:nth-child(3) { width: 82px; }
    [data-table-type="指数"] th:nth-child(4), [data-table-type="指数"] td:nth-child(4),
    [data-table-type="股票"] th:nth-child(4), [data-table-type="股票"] td:nth-child(4) { width: 70px; }
    [data-table-type="指数"] th:nth-child(5), [data-table-type="指数"] td:nth-child(5) { width: 66px; }
    [data-table-type="指数"] th:nth-child(6), [data-table-type="指数"] td:nth-child(6) { width: 84px; }
    [data-table-type="指数"] th:nth-child(7), [data-table-type="指数"] td:nth-child(7) { width: 86px; }
    [data-table-type="股票"] th:nth-child(5), [data-table-type="股票"] td:nth-child(5) { width: 78px; }
    [data-table-type="指数"] th:nth-child(8), [data-table-type="指数"] td:nth-child(8),
    [data-table-type="指数"] th:nth-child(9), [data-table-type="指数"] td:nth-child(9),
    [data-table-type="指数"] th:nth-child(10), [data-table-type="指数"] td:nth-child(10),
    [data-table-type="指数"] th:nth-child(11), [data-table-type="指数"] td:nth-child(11),
    [data-table-type="股票"] th:nth-child(6), [data-table-type="股票"] td:nth-child(6),
    [data-table-type="股票"] th:nth-child(7), [data-table-type="股票"] td:nth-child(7),
    [data-table-type="股票"] th:nth-child(8), [data-table-type="股票"] td:nth-child(8),
    [data-table-type="股票"] th:nth-child(9), [data-table-type="股票"] td:nth-child(9) { width: 90px; }
    [data-table-type="指数"] th:nth-child(n+12), [data-table-type="指数"] td:nth-child(n+12),
    [data-table-type="股票"] th:nth-child(n+10), [data-table-type="股票"] td:nth-child(n+10) { width: 76px; }
    .number { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .return-value { font-weight: 650; }
    .return-value.up { color: var(--red); }
    .return-value.down { color: var(--green); }
    .return-value.flat { color: var(--muted); }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 7px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }
    .badge.good { background: var(--green-bg); color: var(--green); }
    .badge.risk { background: var(--red-bg); color: var(--red); }
    .badge.warn { background: var(--amber-bg); color: var(--amber); }
    .badge.watch { background: var(--blue-bg); color: var(--blue); }
    .badge.neutral { background: var(--gray-bg); color: #52616e; }
    .badge.value-deep { background: #d7f5df; color: #045c3b; }
    .badge.value-low { background: #ecfdf3; color: #14804a; }
    .badge.value-neutral { background: var(--gray-bg); color: #52616e; }
    .badge.value-high { background: var(--amber-bg); color: var(--amber); }
    .badge.value-risk { background: var(--red-bg); color: var(--red); }
    .tag-list { display: flex; flex-wrap: wrap; gap: 4px; min-width: 160px; }
    dialog {
      width: min(1100px, calc(100vw - 32px));
      max-height: calc(100vh - 36px);
      border: 0;
      border-radius: 7px;
      padding: 0;
      box-shadow: 0 20px 60px rgba(20, 34, 46, 0.28);
      overflow: hidden;
    }
    dialog[open] { display: flex; flex-direction: column; }
    dialog::backdrop { background: rgba(17, 29, 38, 0.42); }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 12px;
      padding: 17px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      flex: 0 0 auto;
      z-index: 2;
    }
    .modal-head h3 { margin: 0; font-size: 18px; }
    .modal-title-block { min-width: 0; }
    .modal-title-line { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .modal-close-summary { color: var(--red); font-size: 15px; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .modal-actions { display: flex; align-items: center; gap: 7px; }
    .modal-position { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .nav-btn, .close-btn {
      width: 30px;
      height: 30px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: #fff;
      font-size: 18px;
      line-height: 1;
    }
    .nav-btn:disabled { cursor: not-allowed; color: #b6c0c8; background: #f2f4f6; border-color: var(--line); }
    .modal-body { padding: 17px 18px 20px; overflow-y: auto; flex: 1 1 auto; }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 20px;
    }
    .detail-item { padding: 10px; background: var(--surface-soft); border: 1px solid var(--line); border-radius: 5px; }
    .detail-label { color: var(--muted); font-size: 11px; }
    .detail-value { margin-top: 5px; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .chart-panel {
      margin-bottom: 20px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface-soft);
    }
    .chart-panel[hidden] { display: none; }
    .chart-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .chart-title { margin: 0; font-size: 15px; }
    .chart-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .chart-toggle-row { margin-top: 8px; align-items: center; justify-content: space-between; }
    #chart-trend-controls { margin-left: auto; justify-content: flex-end; }
    .chart-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 28px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      padding: 5px 8px;
      background: #fff;
      color: #4c5a67;
      font-size: 12px;
    }
    .chart-chip.active { background: #263946; color: #fff; border-color: #263946; }
    .chart-chip input { margin: 0; }
    .chart-box {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }
    .chart-tooltip {
      position: absolute;
      z-index: 5;
      display: none;
      max-width: 280px;
      padding: 8px 10px;
      border: 1px solid rgba(30, 42, 54, 0.16);
      border-radius: 5px;
      background: rgba(24, 33, 43, 0.94);
      color: #fff;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-line;
      pointer-events: none;
      box-shadow: 0 10px 26px rgba(20, 34, 46, 0.24);
    }
    .chart-empty { padding: 22px; color: var(--muted); }
    .chart-svg { display: block; width: 100%; height: auto; }
    .chart-subtitle { margin: 14px 0 8px; font-size: 13px; color: #344352; font-weight: 700; }
    .chart-subtitle-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 14px 0 8px;
    }
    .chart-subtitle-row .chart-subtitle { margin: 0; }
    .chart-latest { color: var(--muted); font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .chart-legend { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .legend-line { width: 16px; height: 3px; border-radius: 99px; background: currentColor; }
    .disclaimer { margin: 16px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    @media (max-width: 900px) {
      .app-header { padding: 16px 18px; }
      .header-row { align-items: start; flex-direction: column; gap: 8px; }
      main { padding: 16px 12px 28px; }
      .kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
      .focus-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
      .detail-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .search { width: 100%; }
    }
    @media (max-width: 560px) {
      .kpis, .focus-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="auth-locked">
  <div class="auth-gate" id="auth-gate" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <div class="auth-card">
      <h2 class="auth-title" id="auth-title">访问校验</h2>
      <p class="auth-copy">遵守操作纪律，先想后做！流水不争先，争的是滔滔不绝。</p>
      <form id="auth-form">
        <label class="form-label" for="auth-password">访问密码</label>
        <input class="form-input" id="auth-password" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="请输入密码">
        <div class="auth-error" id="auth-error"></div>
        <button class="primary-btn" type="submit">进入看板</button>
      </form>
    </div>
  </div>

  <header class="app-header">
    <div class="header-inner">
      <div class="header-row">
        <div>
          <h1>趋势观察台</h1>
        </div>
        <div class="as-of" id="as-of">正在载入最新行情...</div>
      </div>
    </div>
  </header>

  <main>
    <section>
      <div class="section-title">
        <h2>趋势概览</h2>
        <span class="section-note" id="asset-count">按综合状态汇总</span>
      </div>
      <div class="kpis" id="kpis"></div>
    </section>

    <section>
      <div class="section-title">
        <h2>优先关注</h2>
        <span class="section-note">风险、修复、强趋势与估值缺失资产</span>
      </div>
      <div class="focus-grid" id="focus-grid"></div>
    </section>

    <section id="index-list-section">
      <div class="section-title">
        <h2>指数观察列表</h2>
      </div>
      <div class="panel">
        <div class="toolbar">
          <div class="segments" id="index-segments"></div>
          <input class="search" id="index-search" type="search" placeholder="搜索指数名称或代码">
        </div>

  <script>
    const fallbackAssets = [
      {name:"沪深300",symbol:"000300",asset_type:"指数",date:"--",close:null,short_trend:"数据不足",mid_trend:"数据不足",long_trend:"数据不足",overall_status:"数据不足",signals:["等待首次发布"],valuation_status:"估值数据缺失"}
    ];
    let assets = fallbackAssets;
    const historyManifest = new Map();
    const historyCache = new Map();
    const historyRequests = new Map();
    let historyManifestPromise = null;
    let fallbackHistoryPromise = null;
    const accessPassword = "流水不争先";
    const authStorageKey = "trend_observer_authenticated";
    const memoryStorage = {};
    const statusFilters = [["all","全部"],["strong","强趋势"],["healthy","健康上升"],["repair","趋势修复"],["weak","趋势转弱"],["fall","下跌通道"],["missing","估值缺失"]];
    const tableStates = {
      "指数": { filter: "all", search: "", sortKey: "", sortDirection: "asc" },
      "股票": { filter: "all", search: "", sortKey: "", sortDirection: "asc" },
    };
    let currentDetailIndex = -1;
    let detailSequence = [];
    const chartState = {
      rangeMonths: 12,
      ma: { MA20: true, MA60: true, MA120: true, MA200: true },
      trends: { short_trend: false, mid_trend: false, long_trend: false },
    };
    const rangeOptions = [[3, "近3个月"], [6, "近6个月"], [12, "近1年"], [36, "近3年"], [60, "近5年"]];
    const maSeries = [
      ["MA20", "MA20", "#2563eb"],
      ["MA60", "MA60", "#7c3aed"],
      ["MA120", "MA120", "#b7791f"],
      ["MA200", "MA200", "#475569"],
    ];
    const trendSeries = [
      ["short_trend", "短期趋势"],
      ["mid_trend", "中期趋势"],
      ["long_trend", "长期趋势"],
    ];

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }
    function displayNumber(value) {
      return typeof value === "number" && Number.isFinite(value) ? value.toFixed(2) : "--";
    }
    function displayPercent(value) {
      return typeof value === "number" && Number.isFinite(value) ? `${value.toFixed(2)}%` : "--";
    }
    function returnClass(value) {
      if (typeof value !== "number" || !Number.isFinite(value)) return "flat";
      if (value > 0) return "up";
      if (value < 0) return "down";
      return "flat";
    }
    function returnCell(value) {
      return `<span class="return-value ${returnClass(value)}">${displayPercent(value)}</span>`;
    }
    function dailyChangeAmount(asset) {
      if (!isFiniteNumber(asset.close) || !isFiniteNumber(asset.daily_return)) return null;
      const previousClose = asset.close / (1 + asset.daily_return / 100);
      return asset.close - previousClose;
    }
    function displaySignedNumber(value) {
      if (!isFiniteNumber(value)) return "--";
      return `${value > 0 ? "+" : ""}${value.toFixed(2)}`;
    }
    function displaySignedPercent(value) {
      if (!isFiniteNumber(value)) return "--";
      return `${value > 0 ? "+" : ""}${value.toFixed(2)}%`;
    }
    function focusIndexSymbol(symbol) {
      if (/^000\\d{3}$/.test(symbol)) return `${symbol}.SH`;
      if (/^399\\d{3}$/.test(symbol)) return `${symbol}.SZ`;
      if (symbol.startsWith("sz")) return `${symbol.slice(2)}.SZ`;
      if (symbol.startsWith("sh")) return `${symbol.slice(2)}.SH`;
      if (symbol.startsWith("hk")) return symbol.slice(2);
      return symbol;
    }
    function readSessionValue(key) {
      try { return window.sessionStorage ? window.sessionStorage.getItem(key) : memoryStorage[key]; }
      catch (error) { return memoryStorage[key]; }
    }
    function writeSessionValue(key, value) {
      try {
        if (window.sessionStorage) {
          window.sessionStorage.setItem(key, value);
          return;
        }
      } catch (error) {}
      memoryStorage[key] = value;
    }
    function toneFromStatus(status) {
      if (["强趋势", "健康上升"].includes(status)) return "good";
      if (["趋势修复", "趋势分歧"].includes(status)) return "warn";
      if (["趋势转弱", "下跌通道", "数据不足"].includes(status)) return "risk";
      return "watch";
    }
    function toneFromTrend(trend) {
      if (String(trend).includes("上升") || String(trend).includes("强势")) return "good";
      if (String(trend).includes("修复") || String(trend).includes("震荡")) return "watch";
      if (String(trend).includes("转弱") || String(trend).includes("下跌")) return "risk";
      return "neutral";
    }
    function toneFromValuation(zone) {
      if (zone === "极低估") return "value-deep";
      if (zone === "低估") return "value-low";
      if (zone === "合理") return "value-neutral";
      if (zone === "偏高") return "value-high";
      if (zone === "高估") return "value-risk";
      if (zone === "估值数据缺失") return "neutral";
      return "neutral";
    }
    function valuationStatusFromPercent(value) {
      if (!isFiniteNumber(value)) return "估值数据缺失";
      if (value < 15) return "极低估";
      if (value < 35) return "低估";
      if (value < 70) return "合理";
      if (value < 90) return "偏高";
      return "高估";
    }
    function valuationColorFromPercent(value) {
      const zone = valuationStatusFromPercent(value);
      if (zone === "极低估") return "#045c3b";
      if (zone === "低估") return "#14804a";
      if (zone === "合理") return "#8b97a3";
      if (zone === "偏高") return "#9a5b00";
      if (zone === "高估") return "#b42332";
      return "#8b97a3";
    }
    function tagTone(tag) {
      if (tag === "极低估") return "value-deep";
      if (tag === "低估") return "value-low";
      if (tag === "合理") return "value-neutral";
      if (tag === "偏高") return "value-high";
      if (tag === "高估") return "value-risk";
      if (["强趋势", "健康上升", "短期强势"].includes(tag)) return "good";
      if (["趋势修复", "趋势分歧"].includes(tag)) return "watch";
      if (["趋势转弱", "下跌通道", "长期下跌", "中期下跌", "长期转弱", "短期转弱"].includes(tag)) return "risk";
      return "neutral";
    }
    function statusMatch(asset, filter) {
      if (filter === "all") return true;
      if (filter === "strong") return asset.overall_status === "强趋势";
      if (filter === "healthy") return asset.overall_status === "健康上升";
      if (filter === "repair") return ["趋势修复", "趋势分歧"].includes(asset.overall_status);
      if (filter === "weak") return asset.overall_status === "趋势转弱";
      if (filter === "fall") return asset.overall_status === "下跌通道";
      if (filter === "missing") return asset.valuation_status === "估值数据缺失";
      return true;
    }
    function normalizeSortLabel(button) {
      if (!button.dataset.sortLabel) {
        button.dataset.sortLabel = button.textContent.replace(/[↕⇅▲▼]/g, "").trim();
      }
      return button.dataset.sortLabel;
    }
    function updateSortIndicators(assetType) {
      const state = tableStates[assetType];
      document.querySelectorAll(`[data-table-type="${assetType}"] [data-sort]`).forEach(button => {
        const label = normalizeSortLabel(button);
        const isSorted = state.sortKey === button.dataset.sort;
        const icon = isSorted ? (state.sortDirection === "asc" ? "▲" : "▼") : "⇅";
        const directionText = isSorted ? (state.sortDirection === "asc" ? "正序" : "倒序") : "未排序";
        button.classList.toggle("sorted", isSorted);
        button.innerHTML = `${escapeHtml(label)} <span class="sort-icon" aria-hidden="true">${icon}</span>`;
        button.title = `${label}：${directionText}`;
        button.setAttribute("aria-label", `${label}：${directionText}，点击切换排序`);
      });
    }
    function visibleAssets(assetType) {
      const state = tableStates[assetType];
      const q = state.search.trim().toLowerCase();
      const filtered = assets.filter(asset => {
        const textMatch = !q || `${asset.name} ${asset.symbol}`.toLowerCase().includes(q);
        return asset.asset_type === assetType && textMatch && statusMatch(asset, state.filter);
      });
      if (!state.sortKey) return filtered;
      return [...filtered].sort((left, right) => {
        const lv = left[state.sortKey], rv = right[state.sortKey];
        const comparison = typeof lv === "number" && typeof rv === "number"
          ? lv - rv
          : String(lv ?? "").localeCompare(String(rv ?? ""), "zh-CN");
        return state.sortDirection === "asc" ? comparison : -comparison;
      });
    }
    function renderSegments(assetType) {
      const state = tableStates[assetType];
      const id = assetType === "指数" ? "index-segments" : "stock-segments";
      document.querySelector(`#${id}`).innerHTML = statusFilters.map(([key, label]) =>
        `<button class="segment ${state.filter === key ? "active" : ""}" data-filter="${key}" data-filter-type="${assetType}">${label}</button>`
      ).join("");
      document.querySelectorAll(`[data-filter-type="${assetType}"]`).forEach(button => button.addEventListener("click", () => {
        state.filter = button.dataset.filter;
        renderSegments(assetType);
        renderTable(assetType);
      }));
    }
    function renderKpis() {
      const scopedAssets = assets;
      const items = [
        ["good", "强趋势", scopedAssets.filter(x => x.overall_status === "强趋势").length, "三周期同步向上", "strong"],
        ["good", "健康上升", scopedAssets.filter(x => x.overall_status === "健康上升").length, "中长期趋势良好", "healthy"],
        ["warn", "修复/分歧", scopedAssets.filter(x => ["趋势修复", "趋势分歧"].includes(x.overall_status)).length, "趋势改善但未完全确认", "repair"],
        ["risk", "转弱/下跌", scopedAssets.filter(x => ["趋势转弱", "下跌通道"].includes(x.overall_status)).length, "需要降低交易频率", "weak"],
      ];
      document.querySelector("#kpis").innerHTML = items.filter(([, , value]) => value > 0).map(([cls, label, value, foot, filter]) =>
        `<button class="kpi ${cls}" data-kpi-filter="${filter}"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-foot">${foot}</div></button>`
      ).join("");
      document.querySelectorAll("[data-kpi-filter]").forEach(button => button.addEventListener("click", () => {
        ["指数", "股票"].forEach(assetType => {
          tableStates[assetType].filter = button.dataset.kpiFilter;
          tableStates[assetType].search = "";
        });
        document.querySelector("#index-search").value = "";
        document.querySelector("#stock-search").value = "";
        renderSegments("指数");
        renderSegments("股票");
        renderTable("指数");
        renderTable("股票");
        document.querySelector("#index-list-section").scrollIntoView({behavior:"smooth", block:"start"});
      }));
    }
    function focusSignals(asset) {
      return (asset.signals || []).filter(tag => !["合理"].includes(tag));
    }
    function shouldFocusAsset(asset) {
      if (asset.overall_status === "数据不足") return false;
      const watchedStatuses = ["强趋势", "下跌通道"];
      const watchedValuations = ["极低估", "低估", "偏高", "高估"];
      const matchesTrend = watchedStatuses.includes(asset.overall_status);
      if (asset.asset_type === "指数") {
        return watchedValuations.includes(asset.valuation_status) || matchesTrend;
      }
      if (asset.asset_type === "股票") {
        const watchedDividend = isFiniteNumber(asset.dividend_yield) && (asset.dividend_yield <= 3 || asset.dividend_yield >= 5);
        return watchedDividend || matchesTrend;
      }
      return matchesTrend;
    }
    function dividendFocusTone(value) {
      if (!isFiniteNumber(value)) return "dividend-neutral";
      if (value >= 5) return "dividend-good";
      if (value <= 3) return "dividend-risk";
      return "dividend-neutral";
    }
    function renderIndexFocusCard(asset) {
      const changeTone = returnClass(asset.daily_return);
      const pePercent = isFiniteNumber(asset.pe_percentile) ? Math.max(0, Math.min(100, asset.pe_percentile)) : null;
      const valuationTone = toneFromValuation(asset.valuation_status);
      return `
        <button class="focus-card focus-compact index-focus ${valuationTone}" data-open="${asset.symbol}" data-open-type="${asset.asset_type}">
          <div class="focus-top">
            <div>
              <div class="focus-index-name">${escapeHtml(asset.name)}</div>
              <div class="focus-index-code">${escapeHtml(focusIndexSymbol(asset.symbol))}</div>
            </div>
            <div class="focus-quote">
              <div class="focus-close">${displayNumber(asset.close)}</div>
              <div class="focus-change ${changeTone}">
                <span>${displaySignedPercent(asset.daily_return)}</span>
              </div>
            </div>
          </div>
          <div class="focus-metric">
            <div class="focus-metric-head">
              <span class="focus-label">PE百分位</span>
              <span class="focus-metric-value ${valuationTone}">${pePercent === null ? "--" : `${pePercent.toFixed(1)}%`}</span>
            </div>
          </div>
          <div class="focus-status-row">
            <div>
              <div class="focus-label">中期状态</div>
              <div class="focus-status-value ${toneFromTrend(asset.mid_trend)}">${escapeHtml(asset.mid_trend || "--")}</div>
            </div>
            <div>
              <div class="focus-label">长期状态</div>
              <div class="focus-status-value ${toneFromTrend(asset.long_trend)}">${escapeHtml(asset.long_trend || "--")}</div>
            </div>
          </div>
        </button>`;
    }
    function renderStockFocusCard(asset) {
      const changeTone = returnClass(asset.daily_return);
      const dividendTone = dividendFocusTone(asset.dividend_yield);
      return `
        <button class="focus-card focus-compact stock-focus ${dividendTone}" data-open="${asset.symbol}" data-open-type="${asset.asset_type}">
          <div class="focus-top">
            <div>
              <div class="focus-index-name">${escapeHtml(asset.name)}</div>
              <div class="focus-index-code">${escapeHtml(asset.symbol)} · ${escapeHtml(asset.asset_type)}</div>
            </div>
            <div class="focus-quote">
              <div class="focus-close">${displayNumber(asset.close)}</div>
              <div class="focus-change ${changeTone}">
                <span>${displaySignedPercent(asset.daily_return)}</span>
              </div>
            </div>
          </div>
          <div class="focus-metric">
            <div class="focus-metric-head">
              <span class="focus-label">股息率</span>
              <span class="focus-metric-value ${dividendTone}">${displayPercent(asset.dividend_yield)}</span>
            </div>
          </div>
          <div class="focus-status-row">
            <div>
              <div class="focus-label">中期状态</div>
              <div class="focus-status-value ${toneFromTrend(asset.mid_trend)}">${escapeHtml(asset.mid_trend || "--")}</div>
            </div>
            <div>
              <div class="focus-label">长期状态</div>
              <div class="focus-status-value ${toneFromTrend(asset.long_trend)}">${escapeHtml(asset.long_trend || "--")}</div>
            </div>
          </div>
        </button>`;
    }
    function renderPlainFocusCard(asset) {
      return `
        <button class="focus-card ${toneFromStatus(asset.overall_status)}" data-open="${asset.symbol}" data-open-type="${asset.asset_type}">
          <div><span class="asset-name">${escapeHtml(asset.name)}</span><span class="asset-symbol">${escapeHtml(asset.symbol)} · ${escapeHtml(asset.asset_type)}</span></div>
          <div style="margin-top:10px"><span class="badge ${toneFromStatus(asset.overall_status)}">${escapeHtml(asset.overall_status)}</span></div>
          <div class="tag-list" style="margin-top:10px">${focusSignals(asset).map(tag => `<span class="badge ${tagTone(tag)}">${escapeHtml(tag)}</span>`).join("")}</div>
        </button>`;
    }
    function renderFocus() {
      const focused = assets.filter(shouldFocusAsset);
      document.querySelector("#focus-grid").innerHTML = focused.length
        ? focused.map(asset => asset.asset_type === "指数" ? renderIndexFocusCard(asset) : renderStockFocusCard(asset)).join("")
        : `<div class="section-note">当前没有需要优先关注的信号。</div>`;
      document.querySelectorAll("[data-open]").forEach(button => button.addEventListener("click", () => openDetail(button.dataset.open, button.dataset.openType)));
    }
    function renderAssetRows(assetType) {
      return visibleAssets(assetType).map(asset => {
        const indexCells = assetType === "指数" ? `
          <td class="number">${displayNumber(asset.pe)}</td>
          <td class="number">${displayPercent(asset.pe_percentile)}</td>
          <td><span class="badge ${toneFromValuation(asset.valuation_status)}">${escapeHtml(asset.valuation_status || "--")}</span></td>` : "";
        const common = `
          <td><span class="asset-name">${escapeHtml(asset.name)}</span><span class="asset-symbol">${escapeHtml(asset.symbol)}</span></td>
          <td>${escapeHtml(asset.date || "--")}</td>
          <td class="number">${displayNumber(asset.close)}</td>

        const tooltipWidth = tooltip.offsetWidth || 240;
        const tooltipHeight = tooltip.offsetHeight || 80;
        let left = event.clientX - bounds.left + 12;
        let top = event.clientY - bounds.top + 12;
        if (left + tooltipWidth > bounds.width - 8) left = event.clientX - bounds.left - tooltipWidth - 12;
        if (top + tooltipHeight > bounds.height - 8) top = event.clientY - bounds.top - tooltipHeight - 12;

        tooltip.style.top = `${Math.max(8, top)}px`;

          return response.json();
        })
        .then(manifest => {
          const files = Array.isArray(manifest.assets) ? manifest.assets.filter(item => item.symbol && item.path) : [];
          files.forEach(item => historyManifest.set(item.symbol, item.path));
          return historyManifest;
        })
        .catch(error => {
          console.warn("未能读取 history/manifest.json，详情页将尝试备用历史文件。", error);

    async function loadAssetHistory(asset) {

      const request = (async () => {
        await loadHistoryManifest();
        const path = historyManifest.get(asset.symbol);
        let rows = [];
        if (path) {
          const response = await fetch(`./history/${encodeURIComponent(path)}`, {cache: "no-store"});
          if (!response.ok) throw new Error(`${path} HTTP ${response.status}`);
          const payload = await response.json();
          rows = Array.isArray(payload.history) ? payload.history : [];
        } else {
          rows = await loadFallbackHistory(asset);
        }
        const scopedRows = rows.filter(row => row.symbol === asset.symbol && row.asset_type === asset.asset_type);
        historyCache.set(cacheKey, scopedRows);
        return scopedRows;
      })().finally(() => {
        historyRequests.delete(cacheKey);

      historyRequests.set(cacheKey, request);
      return request;

    async function loadLatestData() {
      try {
        const response = await fetch("./dashboard_data.json", {cache: "no-store"});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        if (!Array.isArray(payload.assets) || !payload.assets.length) throw new Error("行情数据为空");
        assets = payload.assets;
        document.querySelector("#as-of").textContent = `更新时间：${payload.generated_at || "--"}`;
      } catch (error) {
        document.querySelector("#as-of").textContent = "示例数据 · 等待首次发布";
        console.warn("未能读取 dashboard_data.json，正在展示页面内置示例。", error);
      }
      renderDashboard();
      loadHistoryManifest();
    }
    function initializeAuth() {
      if (readSessionValue(authStorageKey) === "1") {
        document.body.classList.remove("auth-locked");
        loadLatestData();
        return;
      }
      document.body.classList.add("auth-locked");
      setTimeout(() => document.querySelector("#auth-password").focus(), 0);
    }

    document.querySelector("#auth-form").addEventListener("submit", event => {
      event.preventDefault();
      const password = document.querySelector("#auth-password").value.trim();
      if (password === accessPassword) {
        writeSessionValue(authStorageKey, "1");
        document.body.classList.remove("auth-locked");
        document.querySelector("#auth-password").value = "";
        document.querySelector("#auth-error").textContent = "";
        loadLatestData();
      } else {
        document.querySelector("#auth-error").textContent = "密码不正确，请重新输入。";
        document.querySelector("#auth-password").select();
      }
    });
    document.querySelector("#auth-password").addEventListener("input", () => {
      document.querySelector("#auth-error").textContent = "";
    });
    document.querySelector("#index-search").addEventListener("input", event => {
      tableStates["指数"].search = event.target.value;
      renderTable("指数");
    });
    document.querySelector("#stock-search").addEventListener("input", event => {
      tableStates["股票"].search = event.target.value;
      renderTable("股票");
    });
    document.querySelectorAll("[data-sort]").forEach(button => button.addEventListener("click", () => {
      const assetType = button.closest("[data-table-type]")?.dataset.tableType;
      if (!assetType) return;
      const state = tableStates[assetType];
      if (state.sortKey === button.dataset.sort) {
        state.sortDirection = state.sortDirection === "asc" ? "desc" : "asc";
      } else {
        state.sortKey = button.dataset.sort;
        state.sortDirection = "asc";
      }
      renderTable(assetType);
    }));
    document.querySelector("#close-modal").addEventListener("click", () => document.querySelector("#detail-modal").close());
    document.querySelector("#previous-asset").addEventListener("click", () => moveDetail(-1));
    document.querySelector("#next-asset").addEventListener("click", () => moveDetail(1));
    initializeAuth();
  </script>
</body>
</html>
