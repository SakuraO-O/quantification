name: Deploy Trend Dashboard

on:
  push:
    branches: [main]
    paths:
      - "codex/dashboard_example.html"
      - "codex/dashboard_config.js"
      - "codex/dashboard_auth.js"
      - "codex/dashboard_runtime.js"
      - ".github/workflows/deploy_dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare authenticated dashboard
        run: |
          mkdir -p codex/site
          cp codex/dashboard_example.html codex/site/index.html
          cp codex/dashboard_config.js codex/dashboard_auth.js codex/dashboard_runtime.js codex/site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: codex/site
      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
