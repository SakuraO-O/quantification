name: Legacy Trend Observer Export

on:
  workflow_dispatch:

env:
  # Validate the workflow against the Node.js 24 runtime before GitHub makes it the default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  legacy-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r codex/requirements.txt

      - name: Generate compatibility JSON export
        run: python -B -m codex.trend_observer.cli legacy-export

      - name: Commit generated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f codex/data/trend_snapshot.json codex/data/market_valuation_snapshot.json codex/dashboard_data.json codex/history
          if git diff --cached --quiet; then
            echo "No generated market data changes to commit."
          else
            git commit -m "Update daily trend observer data"
            git push
          fi

      - name: Upload generated reports
        uses: actions/upload-artifact@v4
        with:
          name: trend-observer-report-${{ github.run_number }}
          path: |
            codex/trend_observer_report.csv
            codex/trend_observer_report.md
            codex/trend_history.csv
            codex/data/trend_snapshot.json
            codex/data/market_valuation_snapshot.json
            codex/history/**
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare dashboard site
        run: |
          mkdir -p codex/site
          cp codex/dashboard_example.html codex/site/index.html
          cp codex/dashboard_config.js codex/dashboard_auth.js codex/dashboard_runtime.js codex/site/
          cp codex/dashboard_data.json codex/site/dashboard_data.json
          cp -R codex/history codex/site/history

      - name: Upload dashboard site
        uses: actions/upload-pages-artifact@v3
        with:
          path: codex/site

  deploy-pages:
    needs: legacy-export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
