name: Daily Trend Observer

on:
  schedule:
    # Avoid the top-of-hour GitHub Actions load spike. 00:07 UTC is 08:07 in Asia/Shanghai.
    - cron: "7 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  observe-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r codex/requirements.txt

      - name: Generate report and send Feishu notification
        run: python codex/trend_observer.py --notify

      - name: Upload generated reports
        uses: actions/upload-artifact@v4
        with:
          name: trend-observer-report-${{ github.run_number }}
          path: |
            codex/trend_observer_report.csv
            codex/trend_observer_report.md
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare dashboard site
        run: |
          mkdir -p codex/site
          cp codex/dashboard_example.html codex/site/index.html
          cp codex/dashboard_data.json codex/site/dashboard_data.json

      - name: Upload dashboard site
        uses: actions/upload-pages-artifact@v3
        with:
          path: codex/site

  deploy-pages:
    needs: observe-and-notify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
